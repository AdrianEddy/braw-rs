name: Release

# Creates the GitHub release, from the version's CHANGELOG.md section, when a
# `vX.Y.Z+A.B` tag is pushed. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
