name: Release

# Publishes to crates.io through trusted publishing and creates the GitHub release,
# when a `vX.Y.Z` tag is pushed. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # exchange for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      # A tag does not wait for CI, so test the tagged commit before publishing it.
      - run: cargo test --locked --all-features

      # Already published (by hand, or by an earlier run of this workflow): only the
      # GitHub release is left to create.
      - name: Check whether this version is on crates.io
        id: crates-io
        run: |
          if curl -sf -A "braw-rs release workflow (https://github.com/AdrianEddy/braw-rs)" \
               "https://crates.io/api/v1/crates/braw/${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.crates-io.outputs.published != 'true'
        id: auth
      - run: cargo publish --locked
        if: steps.crates-io.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
