# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every advisory — vulnerability, unmaintained, unsound, yanked — fails the check.
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "ISC",
    "MIT",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
